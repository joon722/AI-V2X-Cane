<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V2X 차량 실시간 화면</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0A0C10;overflow:hidden;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased}
  #app{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column}
  #stage{position:relative;flex:1;overflow:hidden;background:#0E1117;min-height:0}
  #scene{position:absolute;inset:0;width:100%;height:100%}
  #alertGlow{position:absolute;inset:0;pointer-events:none;opacity:0;
    box-shadow:inset 0 0 160px 34px rgba(226,75,74,.7);transition:opacity .25s}

  #topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
    justify-content:space-between;padding:14px 20px;z-index:5;gap:10px;
    background:linear-gradient(180deg,rgba(10,12,16,.94),rgba(10,12,16,0))}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .mark{width:25px;height:25px;border-radius:7px;background:#16324D;flex:none;
    display:flex;align-items:center;justify-content:center}
  .brand h1{font-size:13.5px;font-weight:600;color:#E8EAED;letter-spacing:-.2px;
    white-space:nowrap}
  .brand span{display:block;font-size:11px;font-weight:400;color:#6B7280;margin-top:1px;
    white-space:nowrap}
  .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
  .link{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#8B93A1;
    white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;background:#4B5563;flex:none}
  .dot.ok{background:#34D399;box-shadow:0 0 8px rgba(52,211,153,.8);animation:pulse 2s infinite}
  .dot.warn{background:#FBBF24;box-shadow:0 0 8px rgba(251,191,36,.7)}
  .dot.bad{background:#EF4444;box-shadow:0 0 8px rgba(239,68,68,.7)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  #mode{font-size:10.5px;color:#7C8494;background:rgba(20,24,31,.85);
    border:1px solid #262C36;border-radius:7px;padding:4px 9px;white-space:nowrap}

  #banner{position:absolute;top:62px;left:50%;transform:translate(-50%,-12px);
    z-index:6;display:flex;align-items:center;gap:11px;padding:10px 18px;
    border-radius:12px;background:rgba(226,75,74,.15);border:1px solid rgba(226,75,74,.45);
    backdrop-filter:blur(14px);opacity:0;transition:opacity .28s,transform .28s;
    pointer-events:none;max-width:calc(100% - 32px)}
  #banner.on{opacity:1;transform:translate(-50%,0)}
  #banner.warn{background:rgba(239,159,39,.15);border-color:rgba(239,159,39,.45)}
  #banner .ico{width:24px;height:24px;flex:none}
  #banner b{display:block;font-size:13.5px;font-weight:600;color:#FFD9D9;letter-spacing:-.2px}
  #banner small{display:block;font-size:11.5px;color:#F09595;margin-top:1px}
  #banner.warn b{color:#FDE9C8}#banner.warn small{color:#F5C77E}

  #idle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;
    text-align:center;display:none}
  #idle .t{font-size:20px;font-weight:500;color:#9CA3AF;letter-spacing:-.4px}
  #idle .s{font-size:12.5px;color:#5D6470;margin-top:7px;line-height:1.6}

  #hud{position:absolute;left:20px;top:52%;transform:translateY(-50%);z-index:5}
  .big{font-size:54px;font-weight:200;color:#F3F4F6;line-height:.95;letter-spacing:-2.5px;
    font-variant-numeric:tabular-nums}
  .big u{font-size:16px;font-weight:400;color:#6B7280;text-decoration:none;margin-left:5px;
    letter-spacing:0}
  .cap{font-size:10.5px;color:#6B7280;letter-spacing:1.5px;margin-bottom:3px}
  .sub{margin-top:16px}
  .sub .big{font-size:32px;letter-spacing:-1.3px}
  #srcTag{margin-top:14px;display:inline-block;font-size:11px;padding:3px 9px;
    border-radius:6px;background:rgba(30,36,45,.9);color:#8B93A1;border:1px solid #272E39}

  #dock{display:flex;gap:1px;background:#171A21;border-top:1px solid #1F242D;flex:none}
  .cell{flex:1;padding:11px 14px 13px;background:#0F1319;min-width:0}
  .cell .k{font-size:10.5px;color:#5D6470;letter-spacing:.5px;margin-bottom:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .v{font-size:19px;font-weight:500;color:#E8EAED;font-variant-numeric:tabular-nums;
    letter-spacing:-.4px;white-space:nowrap}
  .cell .v i{font-size:11px;font-weight:400;color:#5D6470;font-style:normal;margin-left:3px}
  #levelbar{display:flex;gap:3px;padding:0 14px 12px;background:#0F1319;flex:none}
  .seg{flex:1;height:4px;border-radius:2px;background:#232830;transition:background .3s}

  @media(max-width:600px){
    .big{font-size:40px}.sub .big{font-size:24px}
    .brand h1{font-size:12.5px}.brand span{display:none}
    .cell{padding:9px 9px 11px}.cell .v{font-size:15px}.cell .k{font-size:10px}
    #hud{left:14px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <svg id="scene" viewBox="0 0 900 620" preserveAspectRatio="xMidYMax slice"></svg>
    <div id="alertGlow"></div>

    <div id="topbar">
      <div class="brand">
        <div class="mark">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M12 2.5 4.5 6v6.2c0 4.6 3.2 8.7 7.5 9.8 4.3-1.1 7.5-5.2 7.5-9.8V6L12 2.5Z"
                  stroke="#7DB8F0" stroke-width="1.9" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1>V2X 차량 실시간 화면</h1>
          <span>카메라에 안 보이는 보행자를 V2X로 감지</span>
        </div>
      </div>
      <div class="rt">
        <div class="link"><span class="dot" id="dot"></span><span id="linkTxt">대기 중</span></div>
        <div id="mode">실시간</div>
      </div>
    </div>

    <div id="banner">
      <svg class="ico" viewBox="0 0 24 24" fill="none">
        <path d="M12 3.2 1.8 20.8h20.4L12 3.2Z" stroke="currentColor" stroke-width="1.8"
              stroke-linejoin="round"/>
        <path d="M12 9.6v4.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="17.4" r="1.15" fill="currentColor"/>
      </svg>
      <div><b id="bTitle">보행자 감지</b><small id="bSub">-</small></div>
    </div>

    <div id="idle">
      <div class="t" id="idleT">대기 중</div>
      <div class="s" id="idleS">젯슨에서 아직 데이터가 오지 않았습니다</div>
    </div>

    <div id="hud">
      <div class="cap">보행자 거리</div>
      <div class="big"><span id="dist">--</span><u>m</u></div>
      <div class="sub">
        <div class="cap">충돌 예상</div>
        <div class="big"><span id="ttc">--</span><u>초</u></div>
      </div>
      <div id="srcTag">대기 중</div>
    </div>
  </div>

  <div id="dock">
    <div class="cell"><div class="k">접근 속도</div><div class="v"><span id="clos">--</span><i>m/s</i></div></div>
    <div class="cell"><div class="k">내 차 속도</div><div class="v"><span id="vspd">--</span><i>km/h</i></div></div>
    <div class="cell"><div class="k">상대 위치</div><div class="v" id="bear">--</div></div>
    <div class="cell"><div class="k">위험 등급</div><div class="v" id="lvl">--</div></div>
  </div>
  <div id="levelbar">
    <div class="seg" data-i="0"></div><div class="seg" data-i="1"></div>
    <div class="seg" data-i="2"></div><div class="seg" data-i="3"></div>
  </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const W=900,H=620,HORIZON=150,EYE=600,KX=42;
const scene=document.getElementById("scene");
const LEVEL_COLOR=["#34D399","#FBBF24","#FB923C","#EF4444"];
const LEVEL_NAME=["안전","주의","경고","위험"];
const ROAD_HALF=5.4, WALK_OUT=9.0;
const MY_CAR_Z=4.0;                      // 내 차는 화면 하단 중앙 고정
const MOCK_MODE=new URLSearchParams(location.search).has("mock");

function el(t,a){const n=document.createElementNS(NS,t);
  for(const k in a)n.setAttribute(k,a[k]);return n;}
function proj(z,x){const f=7.5/(z+4);
  return{x:W/2+x*f*KX,y:HORIZON+(EYE-HORIZON)*f,s:f*1.6};}

const gStatic=el("g",{}),gWorld=el("g",{}),gMe=el("g",{});
scene.appendChild(gStatic);scene.appendChild(gWorld);scene.appendChild(gMe);

function buildStatic(){
  const defs=el("defs",{});
  const sky=el("linearGradient",{id:"sky",x1:"0",y1:"0",x2:"0",y2:"1"});
  [["0%","#101827"],["55%","#0C1119"],["100%","#0A0C10"]].forEach(([o,c])=>
    sky.appendChild(el("stop",{offset:o,"stop-color":c})));
  defs.appendChild(sky);
  const mk=(id,c,op)=>{const g=el("radialGradient",{id:id,cx:"50%",cy:"50%",r:"50%"});
    g.appendChild(el("stop",{offset:"0%","stop-color":c,"stop-opacity":op}));
    g.appendChild(el("stop",{offset:"100%","stop-color":c,"stop-opacity":"0"}));
    defs.appendChild(g);};
  mk("mglow","#60A5FA",".26");mk("pglow","#FBBF24",".30");mk("dglow","#EF4444",".42");
  const lg=(id,stops)=>{const g=el("linearGradient",{id:id,x1:"0",y1:"0",x2:"0",y2:"1"});
    stops.forEach(([o,c])=>g.appendChild(el("stop",{offset:o,"stop-color":c})));defs.appendChild(g);};
  lg("carbody",[["0%","#E7ECF2"],["52%","#CCD4DE"],["100%","#98A3B3"]]);   // 매트 은회색 차체
  lg("carglass",[["0%","#39506B"],["100%","#161F2C"]]);                     // 뒷유리
  gStatic.appendChild(defs);

  gStatic.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"url(#sky)"}));
  gStatic.appendChild(el("line",{x1:0,y1:HORIZON,x2:W,y2:HORIZON,
    stroke:"#1C2430","stroke-width":1}));

  // 3차선 도로, 내 차는 가운데 차로 중앙(x=0). 내 차로 좌우 경계 = 파란 테슬라 라인.
  const quad=(x1,x2,fill)=>{
    const a=proj(.6,x1),b=proj(160,x1),c=proj(160,x2),d=proj(.6,x2);
    return el("path",{d:`M${a.x},${a.y} L${b.x},${b.y} L${c.x},${c.y} L${d.x},${d.y} Z`,fill:fill});
  };
  const LANE=3.8;                       // 차로 폭
  gStatic.appendChild(quad(-8.5,-1.5*LANE,"#0E1219"));   // 왼쪽 갓길
  gStatic.appendChild(quad(1.5*LANE,8.5,"#0E1219"));     // 오른쪽 갓길
  gStatic.appendChild(quad(-1.5*LANE,1.5*LANE,"#12161D"));// 3차선 도로 바닥
  // 도로 양끝 흰 경계선
  for(const ex of[-1.5*LANE,1.5*LANE]){
    const a=proj(.6,ex),b=proj(160,ex);
    gStatic.appendChild(el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"#39434F","stroke-width":1.3}));
  }
  // 파란 차선 스트립(내 차로 좌우 경계 = 주행 경로), 소실점으로 모임
  function laneStrip(xw){
    const n=proj(.6,xw), f=proj(70,xw);
    const strip=(wn,wf,col,op)=>gStatic.appendChild(el("path",{
      d:`M${n.x-wn},${n.y} L${n.x+wn},${n.y} L${f.x+wf},${f.y} L${f.x-wf},${f.y} Z`,
      fill:col,"fill-opacity":op}));
    strip(18,3.4,"#3E9BFF",.13);   // 바깥 글로우
    strip(9.5,1.7,"#4FA8FF",.34);  // 중간
    strip(4,.8,"#A6D3FF",.94);     // 밝은 중심선
  }
  laneStrip(-LANE/2); laneStrip(LANE/2);   // 내 차로 좌우(±1.9)
}

// 내 차 (테슬라식, 뒤에서 본 모습) — 화면 하단 중앙
function myCarShape(g,s){
  const W=134*s, H=80*s;
  // 바닥 그림자 + 센싱 글로우
  g.appendChild(el("ellipse",{cx:0,cy:H*.36,rx:W*.52,ry:H*.12,fill:"#04060A","fill-opacity":".5"}));
  g.appendChild(el("ellipse",{cx:0,cy:H*.32,rx:W*.66,ry:H*.20,fill:"url(#mglow)"}));
  // 뒷바퀴(양쪽 하단, 살짝 바깥)
  [-1,1].forEach(d=>{
    g.appendChild(el("rect",{x:d*W*.45-W*.055,y:H*.05,width:W*.11,height:H*.28,rx:W*.028,fill:"#0A0D12"}));
    g.appendChild(el("rect",{x:d*W*.45-W*.04,y:H*.11,width:W*.08,height:H*.15,rx:W*.018,fill:"#1B212A"}));
  });
  // 차체(넓고 낮은 자세 + 뒷펜더 볼륨)
  const body=el("path",{fill:"url(#carbody)",stroke:"none"});
  body.setAttribute("d",
    `M${-W*.47},${H*.18}
     C${-W*.51},${H*.00} ${-W*.49},${-H*.12} ${-W*.44},${-H*.17}
     C${-W*.40},${-H*.31} ${-W*.30},${-H*.43} ${-W*.20},${-H*.48}
     Q${-W*.14},${-H*.54} ${-W*.05},${-H*.54}
     L${W*.05},${-H*.54} Q${W*.14},${-H*.54} ${W*.20},${-H*.48}
     C${W*.30},${-H*.43} ${W*.40},${-H*.31} ${W*.44},${-H*.17}
     C${W*.49},${-H*.12} ${W*.51},${H*.00} ${W*.47},${H*.18}
     Q${W*.46},${H*.30} ${W*.31},${H*.30} L${-W*.31},${H*.30}
     Q${-W*.46},${H*.30} ${-W*.47},${H*.18} Z`);
  g.appendChild(body);
  // 지붕 하이라이트
  g.appendChild(el("path",{fill:"#FFFFFF","fill-opacity":".5",
    d:`M${-W*.15},${-H*.48} Q${-W*.13},${-H*.54} ${-W*.04},${-H*.54} L${W*.04},${-H*.54} Q${W*.13},${-H*.54} ${W*.15},${-H*.48} L${W*.12},${-H*.42} L${-W*.12},${-H*.42} Z`}));
  // 뒷유리(넓은 사다리꼴)
  g.appendChild(el("path",{fill:"url(#carglass)",
    d:`M${-W*.23},${-H*.20} L${-W*.155},${-H*.43} Q${-W*.125},${-H*.47} ${-W*.03},${-H*.47} L${W*.03},${-H*.47} Q${W*.125},${-H*.47} ${W*.155},${-H*.43} L${W*.23},${-H*.20} Q0,${-H*.12} ${-W*.23},${-H*.20} Z`}));
  // 테일라이트 가로 바(은은하게)
  g.appendChild(el("rect",{x:-W*.36,y:-H*.03,width:W*.72,height:H*.05,rx:H*.024,fill:"#5A2226","fill-opacity":".85"}));
  g.appendChild(el("rect",{x:-W*.33,y:-H*.02,width:W*.66,height:H*.02,rx:H*.01,fill:"#D06A6A","fill-opacity":".8"}));
  // 범퍼(하단 투톤) + 번호판
  g.appendChild(el("path",{fill:"#A7B1C0","fill-opacity":".85",
    d:`M${-W*.42},${H*.09} Q${-W*.44},${H*.29} ${-W*.29},${H*.30} L${W*.29},${H*.30} Q${W*.44},${H*.29} ${W*.42},${H*.09} Z`}));
  g.appendChild(el("rect",{x:-W*.085,y:H*.13,width:W*.17,height:H*.09,rx:H*.014,fill:"#E9EDF2"}));
  // 사이드미러
  [-1,1].forEach(d=>g.appendChild(el("path",{fill:"#C4CCD8",
    d:`M${d*W*.45},${-H*.24} q${d*W*.05},${-H*.008} ${d*W*.045},${H*.05} l${-d*W*.04},0 Z`})));
}

// 지팡이 사용자
function caneShape(g,s,col,glow){
  const u=s*28;
  if(glow)g.appendChild(el("ellipse",{cx:0,cy:u*.14,rx:u*1.5,ry:u*.52,fill:glow}));
  g.appendChild(el("ellipse",{cx:0,cy:u*.10,rx:u*.44,ry:u*.16,fill:"#141B24"}));
  g.appendChild(el("circle",{cx:0,cy:-u*1.68,r:u*.27,fill:col}));
  const t=el("path",{fill:col});
  t.setAttribute("d",`M${-u*.31},${-u*1.34} q${u*.31},${-u*.10} ${u*.62},0
    l${u*.13},${u*.86} l${-u*.88},0 Z`);
  g.appendChild(t);
  [-1,1].forEach(d=>g.appendChild(el("path",{
    d:`M${d*u*.29},${-u*.46} l${d*u*.16},${u*.52}`,stroke:col,
    "stroke-width":u*.15,"stroke-linecap":"round",fill:"none"})));
  g.appendChild(el("path",{d:`M${u*.42},${-u*1.12} l${u*.46},${u*1.30}`,
    stroke:"#F5D142","stroke-width":u*.12,"stroke-linecap":"round",fill:"none"}));
}

buildStatic();
const myCar=el("g",{});
const mp=proj(MY_CAR_Z,0);
myCarShape(myCar,mp.s);
myCar.setAttribute("transform",`translate(${mp.x},${mp.y})`);
gMe.appendChild(myCar);

// ===== 데이터 =====
const ST={frame:null,lastHeading:0,lastPos:null,status:"wait"};
let MOCK=null,mockI=0,mockTimer=null;

async function pollLive(){
  try{
    const r=await fetch("/api/live/latest",{cache:"no-store"});
    if(!r.ok)throw new Error("http");
    const j=await r.json();
    if(!j||j.device_id==null){ST.frame=null;ST.status="wait";render();return;}
    ST.frame=j;
    const age=(j.server_age_s!=null)?j.server_age_s:(j.age_s||0);
    ST.status = age>=3 ? "lost" : age>=1 ? "slow" : "ok";
    render();
  }catch(e){
    ST.frame=null;ST.status="lost";render();
  }
}

function startMock(){
  fetch("/mock/riskmap_live_sample.json").then(r=>r.json()).then(j=>{
    MOCK=j.frames||[];
    if(!MOCK.length)return;
    mockTimer=setInterval(()=>{
      ST.frame=MOCK[mockI];ST.status="ok";mockI=(mockI+1)%MOCK.length;render();
    },(j.interval_s||0.5)*1000);
  }).catch(()=>{});
}

if(MOCK_MODE){
  document.getElementById("mode").textContent="목업 (?mock)";
  startMock();
}else{
  setInterval(pollLive,500);pollLive();
}

// ===== 좌표 변환: 지팡이 기준 차량 위치 -> 내 차 기준 보행자 위치 =====
function pedPosition(fr){
  const v=fr.vehicle||{};
  if(v.heading_deg!=null)ST.lastHeading=v.heading_deg;
  if(v.rel_east_m==null||v.rel_north_m==null)return ST.lastPos;   // 이전 프레임 유지
  const pe=-v.rel_east_m, pn=-v.rel_north_m;
  const h=ST.lastHeading*Math.PI/180;
  const forward=pe*Math.sin(h)+pn*Math.cos(h);
  const right  =pe*Math.cos(h)-pn*Math.sin(h);
  ST.lastPos={forward:forward,right:right};
  return ST.lastPos;
}

function fmt(n,d){return n.toFixed(d);}
function setSeg(l){
  document.querySelectorAll(".seg").forEach(s=>{
    const i=+s.dataset.i;
    s.style.background=(l!=null&&i<=l&&l>0)?LEVEL_COLOR[l]:
      (i===0&&l===0?LEVEL_COLOR[0]:"#232830");
  });
}

function drawPed(pos,level){
  while(gWorld.firstChild)gWorld.removeChild(gWorld.firstChild);
  if(!pos)return;
  const z=pos.forward+MY_CAR_Z, x=pos.right;
  const p=proj(z,x);
  if(z<-6||p.s<.03||p.y<HORIZON)return;
  const col=level>=3?"#F87171":level===2?"#FBBF24":"#C7D2DE";
  const gl =level>=3?"url(#dglow)":level===2?"url(#pglow)":null;
  // 예측 진행선: 내 차 -> 보행자
  if(level>=2){
    const a=proj(MY_CAR_Z+1.4,0);
    gWorld.appendChild(el("line",{x1:a.x,y1:a.y,x2:p.x,y2:p.y,
      stroke:level>=3?"#EF4444":"#FBBF24","stroke-width":2,
      "stroke-dasharray":"7 6",opacity:".55"}));
  }
  const g=el("g",{transform:`translate(${p.x},${p.y})`});
  caneShape(g,p.s,col,gl);gWorld.appendChild(g);
}

function render(){
  const fr=ST.frame, st=ST.status;
  const dot=document.getElementById("dot");
  const linkTxt=document.getElementById("linkTxt");
  const idle=document.getElementById("idle");
  const banner=document.getElementById("banner");
  const glow=document.getElementById("alertGlow");

  // 연결 상태
  dot.className="dot"+(st==="ok"?" ok":st==="slow"?" warn":st==="lost"?" bad":"");
  linkTxt.textContent = st==="ok"?"연결됨":st==="slow"?"갱신 지연":
                        st==="lost"?"신호 없음":"대기 중";

  if(!fr||st==="lost"){
    idle.style.display="block";
    document.getElementById("idleT").textContent = st==="lost"?"신호 없음":"대기 중";
    document.getElementById("idleS").textContent = st==="lost"
      ? "젯슨 연결이 끊겼습니다 (3초 이상 갱신 없음)"
      : "젯슨에서 아직 데이터가 오지 않았습니다";
    ["dist","ttc","clos","vspd"].forEach(k=>document.getElementById(k).textContent="--");
    document.getElementById("bear").textContent="--";
    document.getElementById("lvl").textContent="--";
    document.getElementById("lvl").style.color="#E8EAED";
    document.getElementById("srcTag").textContent = st==="lost"?"신호 없음":"대기 중";
    setSeg(null);banner.classList.remove("on");glow.style.opacity="0";
    while(gWorld.firstChild)gWorld.removeChild(gWorld.firstChild);
    return;
  }
  idle.style.display="none";

  const r=fr.risk||{};
  const level=(r.level==null)?0:r.level;          // 재계산 금지 - 젯슨 값 그대로
  const ttcRaw=r.ttc_s;
  const ttc=(ttcRaw==null||ttcRaw>=9999)?null:ttcRaw;
  const dist=(r.distance_m==null)?null:r.distance_m;
  const clos=(r.closing_mps==null)?null:r.closing_mps;
  const vspd=(fr.vehicle&&fr.vehicle.speed_mps!=null)?fr.vehicle.speed_mps*3.6:null;
  const pos=pedPosition(fr);

  document.getElementById("dist").textContent=dist!=null?fmt(dist,1):"--";
  document.getElementById("ttc").textContent=ttc!=null?fmt(ttc,1):"--";
  document.getElementById("clos").textContent=clos!=null?fmt(clos,1):"--";
  document.getElementById("vspd").textContent=vspd!=null?Math.round(vspd):"--";
  document.getElementById("bear").textContent = pos
    ? (Math.abs(pos.right)<1.5 ? (pos.forward>=0?"정면":"후방")
       : (pos.right>0?"우측":"좌측")+(pos.forward>=0?" 전방":" 후방"))
    : "위치 대기";
  const lv=document.getElementById("lvl");
  lv.textContent=level+" · "+LEVEL_NAME[level];lv.style.color=LEVEL_COLOR[level];
  document.getElementById("ttc").style.color=level>=2?LEVEL_COLOR[level]:"#F3F4F6";
  document.getElementById("srcTag").textContent =
    MOCK_MODE?"목업 재생":(st==="slow"?"실시간 (지연)":"실시간 · 젯슨");
  setSeg(level);

  const ic=banner.querySelector(".ico");
  if(level>=2){
    banner.classList.add("on");banner.classList.toggle("warn",level===2);
    ic.style.color=level>=3?"#F09595":"#F5C77E";
    document.getElementById("bTitle").textContent=
      level>=3?"보행자 충돌 위험":"보행자 감지";
    const where=pos?(Math.abs(pos.right)<1.5?"정면":(pos.right>0?"우측":"좌측")):"";
    document.getElementById("bSub").textContent=
      (where?where+" ":"")+(dist!=null?fmt(dist,1)+"m":"")+
      (ttc!=null?" · "+fmt(ttc,1)+"초 후":"");
    glow.style.opacity=level>=3?".92":".38";
  }else{banner.classList.remove("on");glow.style.opacity="0";}

  drawPed(pos,level);
}

render();
</script>
</body>
</html>
